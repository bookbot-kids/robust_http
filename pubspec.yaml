name: robust_http
description: Robust http client package
version: 1.1.0
homepage:

environment:
  # cupertino_http (via native_dio_adapter) requires Dart 3.10+
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  logger: ^2.8.0
  dio: ^5.11.1
  http: ^1.6.0
  http_parser: ^4.1.2
  crypto: ^3.0.7
  # Native HTTP stacks: NSURLSession (iOS/macOS) and Cronet (Android), which
  # give us HTTP/2 and HTTP/3. Only used when `httpEngine` is native/auto.
  native_dio_adapter: ^1.8.0
  # Prevent native URLSession callbacks into an isolate after shutdown.
  cupertino_http: ^3.1.0
  singleton: ^0.0.3-nullsafety
  internet_connection_checker_plus: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
    
flutter:
